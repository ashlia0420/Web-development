<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: 1px solid grey;
            height: 400px;
            width: 250px;
            text-align: center;
            padding: 20px;
            margin: 50px auto;
            background-color: bisque;
            border-radius: 8px;
            box-shadow: 1px 3px 8px grey;
            font-family: Arial, Helvetica, sans-serif;
        }

        div img {
            height: 240px;
            width: 100%;
        }

        div button {

            width: 100%;
            height: 50px;
            padding: 10px;
        }

        section {

            height: 380px;
            width: 250px;
            /* text-align: center; */
            padding: 20px;
            margin: 50px auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 1px 3px 8px grey;
            font-family: Arial, Helvetica, sans-serif;
        }

        .biryani {
            border: 1px solid yellow;
        }

        .biryani h3 {
            color: brown;
        }

        section img {
            height: 180px;
            width: 100%;
            border-radius: 5px;
        }

        .biryani button {
            padding: 10px 25px;
            background-color: red;
            box-shadow: none;
            border-radius: 10px;

        }

        .biryani .price {
            color: rgb(189, 126, 10);
        }
        .avatar{
            height: 350px;
            width: 275px;
            border: 1px solid #090952;
            box-shadow: 1px 2px 5px #090952;
            
        }
        .avatar button{
            margin-top: 10px;
            padding: 15px 45px;
            background-color: #090952;
            color: white;
            border-radius: 5px;
            border: none;

        }
        .avatar h3{
            color: #090952;
        }


        article{
            height: 400px;
            width: 300px;
            border: 1px solid purple;
            text-align: center;
            border-radius: 10px;
            box-shadow: 1px 3px 5px grey;
            margin: 50px auto;
            padding: 15px;
        }
        article img{
            height: 150px;
            width: 150px;
            border-radius: 50%;
            /* padding: 15px; */
        }
        article button{
            background-color: purple;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
        }
        article p{
            color: purple;
        }
        article span{
            color:gray;
            
        }

        table{
            border: 1px solid grey;
            padding: 20px;
            width: 450px;
            border-radius: 5+px;
            box-shadow: 1px 1px 4px grey;
            margin:20px auto;
        }
        table:hover{
            cursor: pointer;
        }
        table img{
            height:200px;
            width: 200px;
            box-shadow: 1px 1px 4px grey;
            margin-right: 20px;
            border-radius: 5px;
        }
        table button{
            background-color: black;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
        table button:hover{
            background-color: green;
            cursor: pointer;
        }
    </style>

</head>

<body>
    <div>
        <img src="./headphone.png" alt="">
        <h2>Headphones</h2>
        <p>&#8377; 3999</p>
        <button>Buy Now</button>
    </div>
    <br><br><br>
    <section class="biryani">
        <img src="./biriyani.png" alt="">
        <h3>Chicken Biryani</h3>
        <p>Aromatic basmati rice cooked with
            tender chicken,spices and herbs.</p>
        <h3 class="price">&#8377;249</h3>
        <button>Order now</button>
    </section>
    <br><br><br>
    <section class="avatar">
        <img src="./Avatar.png" alt="">
        <h3>Avatar</h3>
        <p>⭐ 8.5 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span
                style="color: grey;">|</span>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2h 42min</p>

        <hr>
        <button>Watch Now</button>
        

    </section>
    <article>
        <img src="./photo.png" alt="">
        <h3>Rahul Kumar</h3>
        <p style="color: grey;font-size: 18px;">Web Developer</p>
        <hr>
        <p>HTML &nbsp;&nbsp;&nbsp;<span>|</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;CSS &nbsp;&nbsp;&nbsp;<span>|</span>&nbsp;&nbsp;&nbsp;&nbsp;JAVASCRIPT</p>
        <br>
        <button>Contact Me</button>
    </article>

    <br><br><br><br>
    <table>
        <tr>
            <td><img src="./image.png" alt=""></td>
            <td>
                <h3>Sports Shoes</h3>
                <p>Comfortable and stylish shoes for everyday use.</p>
                <h3 style="color: green;">&#8377;1,499</h3>
                <button>Add to Cart</button>
            </td>
        </tr>
    </table>
    <br><br><br><br><br>

</body>

</html>
