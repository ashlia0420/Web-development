<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        .outer{
            width: 300px;

            border:none;
            overflow: hidden;
            font-family:Verdana, Geneva, Tahoma, sans-serif;
            margin: 30px auto;
            box-shadow: 1px 1px 10px grey;
            border-radius: 15px;
        }
        .outer img{
            width:100%;
            
            display: block;
        }
        .inner{
            padding: 0px 10px 30px;
        }
        .inner button{
            height: 50px;
            width: 100%;
            color: aliceblue;
            background-color: purple;
            border-radius: 15px;
            border: none;
        }
        .price{
            font-weight: 1000;
            font-size: 18px;
        }
        .fa-star,.fa-star-half{
            color: #d5d509;
            font-size: 16px;
            letter-spacing: -3px;
        }
        .beach-wifi{
            font-size: 14px;
        }
        .outer-sect{
            width: 300px;
            height: auto;
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <div class="outer">
        <img src="./Beach1.jpg" alt="">
        <div class="inner">
            <h3>Oceanfront Retreat</h3>
            <p>🏖️<span class="beach-wifi">Beach View</span> <i class="fa-solid fa-wifi"></i><span class="beach-wifi"> Wifi</span> </p>
            <p>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star-half"></i>
                
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;250 Reviews</p>
            <p class="from">From</p>
            <p><span class="price">$150</span>/Night</p>
            <p>Indulge in a luxurious Beachfront escape,featuring modern amenties and breathtaking views</p>
            <button>Book Now</button>
        </div>
    </div>
    <section class="outer-sect">
        <img src="" alt="">
        <section class="inner-sect">
            <h3>Grand Plaza Hotel</h3>
            <i class="fa-solid fa-location-dot"></i><p   style="color: grey;"> Downtown Manhattan, New York</p>
            <p class="tag">Free Wifi</p>
            <p class="tag">Pool</p>
            <p class="tag">Spa</p>
            <p><i class="fa-solid fa-star"></i>4.8 <span style="color: grey;">(1,685 reviews)</span></p>
            <p><span style="font-size: 25px;">$289</span><small style="color: grey;">per night</small></p>


        </section>

    </section>
</body>
</html>
