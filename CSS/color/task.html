<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task</title>
    <style>
        body{
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
      
        .card td{
            border: 1px solid grey;
            border-radius: 10px;
            padding: 10px;
            width: 150px;
                        

        }
        .card button{
            padding: 10px 15px;
            border-radius: 10px;
            border: none;
        }
        .card img{
            height: 120px;
            width: 120px;
        }
        .card1
        {
            padding: 15px;
            box-shadow: 0px 0px 20px grey;
            border-radius: 10px;
        }
        .first img{
            border-radius: 50%;
        }
        .card1 .first{
            background-color: lightblue;
        }
        .card1 .first h3{
            color: blue;
        }
        .card1 .first .job-role{
            color: grey;

        }
        
        .card1 .first button{
            background-color: blue;
            color: white;
        }
        .card1 .second{
            background-color: lightgreen;
        }
        .card1 .second h3{
            color: green;

        }
        .card1 .second button{
            background-color: green;
        }

        .card1 .third{
            background-color: lightyellow;
        }
        .card1 .third h3{
            color: orange;

        }
        .card1 .third button{
            background-color: orange;
        }


    </style>
</head>

<body>
    <div class="card">
        <table class="card1">
            <tr>
                <td class="first">
                    <img src="./profile.jpg" alt="profile">
                    <h3>John Doe</h3>
                    <p class="job-role">Web Developer</p>
                    
                    <p>Hello! I build modern web application</p>
                    <button>View Profile</button>
                </td>
                <td class="second">
                    <img src="./tshirt.webp" alt="profile">
                    <h3>Cotton T-shirt</h3>
                    <h3>&dollar;19.99</h3>
                    <br>
                    <p>Comfortable and breathable fabric.</p>
                    <button>Add to Cart</button>

                </td>
                <td class="third">
                    <img src="./warning.png" alt="profile">
                    <h3>Warning!</h3>
                    <p>Your account session will expire soon.</p>
                    <button>Dismiss</button>

                </td>
            </tr>
        </table>
    </div>
</body>

</html>
