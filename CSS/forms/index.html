<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        h1 {
            text-align: center;
            color: blueviolet;
        }
    </style>
</head>

<body>
    <h1>Student Registration</h1>

    <br><br><br>

    <label for="">Full name:</label>
    <input type="text">
    <br><br>
    <label for="">Password:</label>
    <input type="password">
    <br><br>
    <label for="">Email:</label>
    <input type="email">
    <br><br>
    <label for="">Age:</label>
    <input type="number">
    <br><br>
    <label for="">Mobile:</label>
    <input type="tel">
    <br><br>
    <label for="">Date of Birth</label>
    <input type="date">
    <br><br>
    <label for="">Preferred Time:</label>
    <input type="time">
    <br><br>
    <label for="">Interview Date & Time:</label>
    <input type="datetime-local">
    <br><br>
    <label for="">Joining month:</label>
    <input type="month">
    <br><br>
    <label for="">Training Week:</label>
    <input type="week">
    <br><br>
    <label for="">Upload Resume:</label>
    <input type="file">
    <br><br>
    <label for="">Favourite Color:</label>
    <input type="color">
    <br><br>
    <label for="">Search Courses:</label>
    <input type="search">
    <br><br>
    <label for="">Your Half Knowledge:🔥</label>
    <input type="range">
    <br><br>
    <label for="">Gender:</label>
    <input type="radio" name="A">Male
    <input type="radio" name ="A">Female
    <input type="radio" name = "A">others
<br><br>
    <label for="">Hobbies: </label>
    <input type="checkbox">Sleeping
    <input type="checkbox">Reading
    <input type="checkbox">Eating
    <input type="checkbox">OverThinking
    <br><br>

    <label for="">Great Qspiders Address:</label>
    <textarea cols="30" rows="10"></textarea>

    <br><br>
    <br><br>



    <button>Submit</button>
    <br><br>
</body>

</html>
