<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC | Order KFC Chicken Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif */

        }

        body {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 120px;
            border: 1px solid grey;
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 15px;

        }

        .nav-left {
            border: 2px solid saddlebrown;
            display: flex;
            text-align: center;
            justify-content: center;
            gap: 40px;

        }

        .nav-left a {
            text-decoration: none;
            color: rgb(76, 76, 76);
            /* font-weight: 50; */

        }

        .nav-right {
            border: 1px solid green;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .banner {
            border: 2px solid red;
            padding: 10px;
            background-color: black;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            letter-spacing: 1px;
            /* font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; */
        }

        .banner button {
            padding: 15px 45px;
            border-radius: 27px;
            background-color: red;
            color: white;
            border: none;

        }


        .browse-menu {
            border: 5px solid blue;
            width: 1250px;
            justify-content: center;
            align-items: center;
    
        }

        .browse-menu-heading {
            border: 5px solid powderblue;
            display: flex;
            padding: 20px;
        }
        .browse-menu-heading>h1{
            display: inline;
            letter-spacing: 1px;
        }
        .browse-menu-heading-line{
            border-bottom: 1px solid grey;
            width: 300px;
            display: inline;
        }

        .card-menu1 {
            border: 5px solid brown;
            display: flex;
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-left">
            <div class="logo">
                <img src="./src/kfcLogo.492728c6.svg" alt="">
            </div>
            <a href="">Menu</a>
            <a href="">Deals</a>
        </div>
        <div class="nav-right">
            <a href="">i Sign in</a>
            <p>|</p>
            <img src="" alt="">
        </div>
    </nav>
    <section class="banner">
        <span>LET'S ORDER FOR DELIVERY, PICK UP OR DINE-IN</span>
        <button>Start Order</button>
    </section>
    <section>
        <div class="browse-menu">
            <div class="browse-menu-heading">
                <h1>BROWSE MENU CATEGORIES</h1>
                <div class="browse-menu-heading-line">
                </div>
            </div>
            <div class="card-menu">
                <article class="card-menu1">
                    <div class="wednesday-spl-card">
                        <img src="./src/KFC-Wednesday-Special-app.jpg.webp" alt="">
                        <p>WEDNESDAY SPECIAL</p>
                    </div>
                    <div class="spls-card">
                        <div class="card">
                            <img src="./src/Dynamite_without_noodle_-_465x327px.webp" alt="">
                            <p>DOUBLE CHICKEN DYNAMITE</p>
                        </div>
                        <div class="card">
                            <img src="./src/Shawowrma_wrap_LSM_465x327.webp" alt="">
                            <p>SHAWOWRMA SPECIALS</p>
                        </div>
                        <div class="card">
                            <img src="./src/KFC-Gold-Burger-White-Category-23MAY_4.webp" alt="">
                            <p>GOLD EDITION</p>
                        </div>
                        <div class="card">
                            <img src="./src/KFC-category-EPIC-Bucket-3_Wednesday-Special-15-PC-Bucket_-28th-JAN.webp"
                                alt="">
                            <p>EPIC BUCKET OF THE DAY</p>
                        </div>
                    </div>
                </article>
                <article>

                </article>
                <article>

                </article>
            </div>
        </div>
    </section>
    <footer>

    </footer>



</body>

</html>
