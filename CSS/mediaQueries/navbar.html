<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        nav{
            border: 1px solid grey;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
            color: white;
            padding: 8px 40px;
        }
        h1{
            /* border: 1px solid yellow; */
            /* color: white; */
            
        }
        div{
            /* border: 2px solid orange; */
            display: flex;
            gap: 30px;
        }
        div a{
            color: white;
            text-decoration: none;
            font-size: 20px;

        }
        @media(max-width:600px)
        {
            nav{
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background-color: green;

            }
            div{
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
            }
        }

    </style>
</head>
<body>
    <nav>
        <h1>StarBucks</h1>
        <div>
            <a href="">Home</a>
            <a href="">Offers</a>
            <a href="">Items</a>
            <a href="">Contact</a>
        </div>
    </nav>
</body>
</html>
