<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        /* box-sizing: border-box; */
        font-family: Arial, Helvetica, sans-serif;
    }
    body{
        display: flex;
        justify-content: center;
        padding: 20px;
    }
    section{
        border: 2px solid green;
        width: 800px;
        flex-wrap: wrap;
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }
    div{
        border: 0.5px solid grey;
        width: 230px;
        text-align: center;
        padding: 10px;
        border-radius: 5px;

    }
    img{
        width: 100%;
    }
    button{
        width: 100%;
        background-color: green;
        color:white;
        border: none;
        padding: 7px 0px;
        font-size: 15px;
        border-radius: 4px;
    }
    h2{
        margin-bottom: 15px;
        font-weight: normal;
        color: rgb(65, 61,61);
    }
    @media(max-width:600px)
    {
        div{
            width: 200px;
        }
        section{
            background-color: bisque;
        }
    }

</style>
<body>
    <section>
        <div>
            <img src="https://picsum.photos/300/200?random=1" alt="">
            <!-- here the 300 is hwight and 200 is width -->
            <h2>Headphones</h2>
            <button>Buy Now</button>
        </div>
        <div>
            <img src="https://picsum.photos/300/200?random=2" alt="">
            <h2>Laptop</h2>
            <button>Buy Now</button>
        </div>
        <div>
            <img src="https://picsum.photos/300/200?random3" alt="">
            <h2>Lipstick</h2>
            <button>Buy Now</button>
        </div>
        <div>
            <img src="https://picsum.photos/300/200?random=4" alt="">
            <h2>Stuffed Toy</h2>
            <button>Buy Now</button>
        </div>
        <div>
            <img src="https://picsum.photos/300/200?random=5" alt="">
            <h2>Shoes</h2>
            <button>Buy Now</button>
        </div>
        <div>
            <img src="https://picsum.photos/300/200?random=6" alt="">
            <h2>Tshirt</h2>
            <button>Buy Now</button>
        </div>

        
    </section>
</body>
</html>
