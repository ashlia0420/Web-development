<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        div{
            width: 300px;
            /* height: 500px; */
            border:1px solid grey;
            box-shadow: 1px 1px 10px grey;
            position: relative;
            text-align: center;
            border-radius: 15px;
            overflow: hidden;
            
            
        }
        #cover{
            width: 100%;
            height: 200px;
            display: block;
            
        }
        #profile{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
            top:148px;
            left: 100px;
            border: 6px solid white;
            
        }
        h2{
            margin-top: 60px;
        }
        section{
            padding: 20px;
        }
        h4{
            color: grey;
            margin-top: -18px;
        }
    </style>
</head>
<body>
    <div >
        <img id="cover" src="./image.png" alt="cover">
        <img id="profile" src="./photo.png" alt="profile">
        <section>
            <h2>AlphaBeta</h2>
            <h4>@betaalpha</h4>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Fugit expedita corporis aliquam ullam officiis incidunt cum possimus temporibus accusantium repudiandae?</p>
        </section>
    </div>
    
</body>
</html>
