<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Teams</title>
    <style>

        h1{
            text-align: center;
        }
        div{
            text-align: center;
            padding:20px;

        <ul type="none">
            <li>⭐ HTML & CSS</li>

</html>
