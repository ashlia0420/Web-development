<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class</title>
    <style>
        input:focus{
            background-color: aquamarine;
            border: 3px solid red;
        }
        input{
            outline:none;
        }
        
        button{
            padding: 20px 30px;
            color: brown;
            background-color: bisque;
            border: none;
        }
        button:hover{
            background-color: brown;
            color: bisque;
        }

        input[type="checkbox"]:checked{
            accent-color: rgb(141, 23, 43);
            height: 30px;
            width: 20px;
        }

        input[type="radio"]:checked{
            accent-color: purple;
        }

        a:link{
            color: rgb(91, 179, 40);
        }
        a:visited{
            color: orange;
        }
        a:active{
            color:white;
            background-color: rgb(237, 100, 180);
        }

    </style>
</head>

<body>
    <form action="">
        <label for="">Name</label>
        <br><br>
        <input type="text">
        <br><br><br>
        <label for="">Hobbies</label>
        <br><br>
        <input type="checkbox">Travelling
        <input type="checkbox">Reading
        <input type="checkbox">Crocheting
        <br><br><br>
        <label for="">Payment:</label>
        <br><br>
        <input type="radio">UPI
        <input type="radio">CARD
        <input type="radio">CASH
        <br><br><br>
        <button>Submit</button>

        <br><br><br><br><br>
        <a href="https://www.youtube.com" target="_blank">Open Youtube</a>
        <a href="https://www.instagram.com" target="_blank">Open Instagram</a>


    </form>    
</body>
</html>
