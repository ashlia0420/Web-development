<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        div
        {
            background-color: black;
            border-radius: 10px;
            width: 550px;
        }
        
        table{
            padding: 20px;
            text-align: left;
        }
        td{
            color: azure;
            padding: 10px;
        }
        .para{
            font-size: 14px;
        }
        button{
            background-color: yellow;
            border-radius: 10px;
            padding: 10px;
        }
        img{
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div>
    <table>
        <tr>
            <td class="td1">
                <h2>Explore the world</h2>
                <p class="para">Travel to the most beautiful places <br>
                    and make memories that last forever.</p>
                <button>Discover Places</button>
            </td>
            <td>
                <img height="200" width="220" src="./image1.jpg" alt="img">
            </td>
        </tr>
    </table>
    </div>
    
</body>
</html>
